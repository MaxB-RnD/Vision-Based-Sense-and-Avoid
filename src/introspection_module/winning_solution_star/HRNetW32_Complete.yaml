# ------------------------------------------------------------------------------
# -                          D E S C R I P T I O N                             -
# ------------------------------------------------------------------------------
# Experiment:   HRNetW32_Complete
# Model:        HRNetSegmentation (hrnet_w32)
# Role:         Segmentation model (model_seg1)
# Reference:    Winning Solution Table 2 - AFDR 81.2% @ 0.0002 FPPI
# Notes:
#   - CosineAnnealingWarmRestarts (T_0=16, T_mult=1.42).
#   - False positive mining at epochs: 80, 150, 230.
#   - Final checkpoint at epoch 300.
# ------------------------------------------------------------------------------

meta:
  experiment: HRNetW32_Corruption
  version: 4
  author: MBusato
  model: HRNetSegmentation
  backbone: hrnet_w32
  role: segmentation
  input_resolution: [512, 512]
  optimizer: sgd
  scheduler: CosineAnnealingWarmRestarts

model_params:
  model_type:             HRNetSegmentation
  model_cls:              HRNetSegmentation
  base_model_name:        hrnet_w32
  input_frames:           2
  feature_location:       ''
  combine_outputs_dim:    512
  combine_outputs_kernel: 1
  upscale_mode:           nearest
  output_binary_mask:     true
  output_above_horizon:   true
  pred_scale:             8

train_params:
  # --- Duration ---
  nb_epochs:            300
  nb_samples_per_epoch: 2048
  nb_samples_valid:     512

  # --- Optimiser ---
  initial_lr:            1.0e-3
  optimizer:             sgd
  grad_clip:             8.0
  freeze_backbone_steps: 5

  # --- Scheduler: CosineAnnealingWarmRestarts ---
  scheduler:        CosineAnnealingWarmRestarts
  scheduler_period: 16      # T_0
  scheduler_t_mult: 1.42    # T_mult

  # --- Loss ---
  mask_loss: fl

  # --- Crop Sampling (50 / 25 / 25 split) ---
  # 50% Fully Random Crops.
  # 25% Hard False Positive Frames.
  # 25% Airborne Frames.
  tracking_samples_share: 0.25
  fp_samples_share:       0.25
  fpm_batch_size:         4

  # --- False Positive Mining ---
  fpm_epochs:
    80:  8
    150: 8
    230: 8

  # --- Loss Weights ---
  loss_scale:
    cls:           2000
    size:          1
    offset:        0.2
    distance:      1
    tracking:      1
    above_horizon: 1

train_data_loader:
  batch_size:   8
  num_workers:  7

val_data_loader:
  batch_size:   4
  num_workers:  4

dataset_params:
  back_steps:            [1]
  scale:                 1
  crop_with_plane_ratio: 0.5
  crop_size:             [512, 512]
