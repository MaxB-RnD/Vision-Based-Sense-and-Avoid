# -                          D E S C R I P T I O N                             -
# ------------------------------------------------------------------------------
# Experiment: mobilenetv4_conv_small
# Model:      MobileNetV4Segmentation (mobilenetv4_conv_small.e2400_r224_in1k)
# Role:       Lightest backbone in the complexity vs AFDR experiment.
# Hypothesis: Represents the minimum viable edge-deployable architecture.
#             Expected to show the largest accuracy drop from the baseline,
#             establishing the low-performance anchor of the curve.
# Notes:
#   - Uses 512x512 crops around detections.
#   - combine_outputs_dim reduced to 256 vs HRNet (512).
#   - SGD + cosine warm restarts.
# ------------------------------------------------------------------------------

meta:
  experiment: mobilenetv4_conv_small
  version: 2
  author: MBusato
  model: MobileNetV4Segmentation
  backbone: mobilenetv4_conv_small.e2400_r224_in1k
  role: crop_refinement
  input_resolution: [512, 512]
  optimizer: sgd
  scheduler: CosineAnnealingWarmRestarts

model_params:
  model_type:             MobileNetV4Segmentation
  model_cls:              MobileNetV4Segmentation
  base_model_name:        mobilenetv4_conv_small.e2400_r224_in1k
  input_frames:           2
  feature_location:       ''
  combine_outputs_dim:    256
  combine_outputs_kernel: 1
  output_binary_mask:     true
  output_above_horizon:   true
  pred_scale:             8

train_params:
  nb_epochs:              300
  nb_samples_per_epoch:   2048
  nb_samples_valid:       512
  initial_lr:             1.0e-3
  optimizer:              sgd
  scheduler:              CosineAnnealingWarmRestarts
  scheduler_period:       16
  scheduler_t_mult:       1.42
  grad_clip:              8.0
  freeze_backbone_steps:  5
  mask_loss:              fl
  tracking_samples_share: 0.25
  fp_samples_share:       0.25
  fpm_batch_size:         4
  # Epochs at which to run false positive mining.
  # Value = step size (every nth frame is evaluated).
  fpm_epochs:
    80:   8
    150:  8
    230:  8
  loss_scale:
    cls:           2000
    size:          1
    offset:        0.2
    distance:      1
    tracking:      1
    above_horizon: 1

train_data_loader:
  batch_size:   8
  num_workers:  7

val_data_loader:
  batch_size:   4
  num_workers:  4

dataset_params:
  back_steps:            [1]
  scale:                 1
  crop_with_plane_ratio: 0.50
  crop_size:             [512, 512]
  