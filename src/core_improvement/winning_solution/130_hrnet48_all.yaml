# ------------------------------------------------------------------------------
# -                          D E S C R I P T I O N                             -
# ------------------------------------------------------------------------------
# Experiment:   130_hrnet48_all
# Model:        HRNetSegmentation (hrnet_w48)
# Role:         Crop refinement model (model_seg3)
# Reference:    Winning Solution Table 2 - AFDR 81.7% @ 0.0002 FPPI
# Notes:
#   - Used on 512x512 crops in final submission.
#   - hrnet_w48 is the largest and most accurate single model in the ensemble.
#   - combine_outputs_dim=512 matches hrnet_w32 configuration.
#   - Part of 130_ training phase (post 120_ series).
# ------------------------------------------------------------------------------

meta:
  experiment: 130_hrnet48_all
  version: 2
  author: MBusato
  model: HRNetSegmentation
  backbone: hrnet_w48
  role: crop_refinement
  input_resolution: [512, 512]
  optimizer: sgd
  scheduler: CosineAnnealingWarmRestarts

train_params:
  nb_epochs:              770
  nb_samples_per_epoch:   16384
  nb_samples_valid:       1024
  initial_lr:             1.0e-3
  optimizer:              sgd
  scheduler:              CosineAnnealingWarmRestarts
  scheduler_period:       16
  scheduler_t_mult:       1.42
  grad_clip:              8.0
  freeze_backbone_steps:  5
  mask_loss:              fl
  tracking_samples_share: 0.25
  fp_samples_share:       0.25
  fpm_batch_size:         4
  fpm_epochs:
    250:  8
    370:  8
    535:  8
    770:  8
    1100: 8
    1535: 8
  loss_scale:
    cls:           2000
    size:          1
    offset:        0.2
    distance:      1
    tracking:      1
    above_horizon: 1

train_data_loader:
  batch_size:   4
  num_workers:  8

val_data_loader:
  batch_size:   2
  num_workers:  4

dataset_params:
  back_steps:            [1]
  scale:                 1
  crop_with_plane_ratio: 0.25
  crop_size:             [512, 512]
