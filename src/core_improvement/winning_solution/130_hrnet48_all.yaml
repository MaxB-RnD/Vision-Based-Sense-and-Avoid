# ------------------------------------------------------------------------------
# -                          D E S C R I P T I O N                             -
# ------------------------------------------------------------------------------
# Experiment:   130_hrnet48_all
# Model:        HRNetSegmentation (hrnet_w48)
# Role:         Crop refinement model (model_seg3)
# Reference:    Winning Solution Table 2 - AFDR 81.7% @ 0.0002 FPPI
# Notes:
#   - Used on 512x512 crops in final submission.
#   - hrnet_w48 is the largest and most accurate single model in the ensemble.
#   - combine_outputs_dim=512 matches hrnet_w32 configuration.
#   - Part of 130_ training phase (post 120_ series).
# ------------------------------------------------------------------------------

meta:
  experiment: 130_hrnet48_all
  version: 2
  author: MBusato
  model: HRNetSegmentation
  backbone: hrnet_w48
  role: crop_refinement
  input_resolution: [512, 512]
  optimizer: sgd
  scheduler: CosineAnnealingWarmRestarts

model_params:
  model_type:             HRNetSegmentation
  model_cls:              HRNetSegmentation
  base_model_name:        hrnet_w48
  input_frames:           2
  feature_location:       ''
  combine_outputs_dim:    512
  combine_outputs_kernel: 1
  upscale_mode:           nearest
  output_binary_mask:     true
  output_above_horizon:   true
  pred_scale:             8

train_params:
  nb_epochs:              300
  nb_samples_per_epoch:   2048
  nb_samples_valid:       512
  initial_lr:             1.0e-3
  optimizer:              sgd
  scheduler:              CosineAnnealingWarmRestarts
  scheduler_period:       16
  scheduler_t_mult:       1.42
  grad_clip:              8.0
  freeze_backbone_steps:  5
  mask_loss:              fl
  tracking_samples_share: 0.25
  fp_samples_share:       0.25
  fpm_batch_size:         4
  # Epochs at which to run false positive mining.
  # Value = step size (every nth frame is evaluated).
  fpm_epochs:
    80:   8
    150:  8
    230:  8
  loss_scale:
    cls:           2000
    size:          1
    offset:        0.2
    distance:      1
    tracking:      1
    above_horizon: 1

train_data_loader:
  batch_size:   8
  num_workers:  7

val_data_loader:
  batch_size:   4
  num_workers:  4

dataset_params:
  back_steps:            [1]
  scale:                 1
  crop_with_plane_ratio: 0.50
  crop_size:             [512, 512]
