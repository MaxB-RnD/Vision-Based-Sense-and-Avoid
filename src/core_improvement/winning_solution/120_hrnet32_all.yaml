# ------------------------------------------------------------------------------
# Experiment:   120_hrnet32_all
# Model:        HRNetSegmentation (hrnet_w32)
# Role:         Segmentation model (model_seg1)
# Reference:    Winning Solution Table 2 - AFDR 81.2% @ 0.0002 FPPI
# Notes:
#   - CosineAnnealingWarmRestarts (T_0=16, T_mult=1.42).
#   - False positive mining at epochs: 250, 370, 535, 770, 1100, 1535.
#   - Final checkpoint at epoch 2220.
# ------------------------------------------------------------------------------

meta:
  experiment: 120_hrnet32_all
  version: 2
  author: MBusato
  model: HRNetSegmentation
  backbone: hrnet_w32
  role: segmentation
  input_resolution: [512, 512]
  optimizer: sgd
  scheduler: CosineAnnealingWarmRestarts

model_params:
  model_type:             HRNetSegmentation
  model_cls:              HRNetSegmentation
  base_model_name:        hrnet_w32
  input_frames:           2
  feature_location:       ''
  combine_outputs_dim:    512
  combine_outputs_kernel: 1
  upscale_mode:           nearest
  output_binary_mask:     true
  output_above_horizon:   true
  pred_scale:             8

train_params:
  nb_epochs:              300
  nb_samples_per_epoch:   2048
  nb_samples_valid:       512
  initial_lr:             1.0e-3
  optimizer:              sgd
  scheduler:              CosineAnnealingWarmRestarts
  scheduler_period:       16
  scheduler_t_mult:       1.42
  grad_clip:              8.0
  freeze_backbone_steps:  5
  mask_loss:              fl
  tracking_samples_share: 0.25
  fp_samples_share:       0.25
  fpm_batch_size:         4
  # Epochs at which to run false positive mining.
  # Value = step size (every nth frame is evaluated).
  fpm_epochs:
    80:   8
    150:  8
    230:  8
  loss_scale:
    cls:           2000
    size:          1
    offset:        0.2
    distance:      1
    tracking:      1
    above_horizon: 1

train_data_loader:
  batch_size:   8
  num_workers:  7

val_data_loader:
  batch_size:   4
  num_workers:  4

dataset_params:
  back_steps:            [1]
  scale:                 1
  crop_with_plane_ratio: 0.50
  crop_size:             [512, 512]
